[project]
name = "hpc-access-cli"
version = "0.2.3"
authors = [
  { name="Manuel Holtgrewe", email="manuel.holtgrewe@bih-charite.de" },
]
description = "CLI for hpc-access"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx~=0.27",
  "ldap3~=2.9",
  "mechanize~=0.4",
  "pydantic~=2.6",
  "pydantic-settings~=2.1",
  "pyhumps~=3.8",
  "python-dotenv~=1.0",
  "rich~=13.7",
  "typer~=0.9",
  "typing_extensions~=4.9",
  "xattr~=1.1",
]

[project.scripts]
hpc-access-cli = "hpc_access_cli.main:app"

[project.urls]
Homepage = "https://github.com/bihealth/hpc-access-cli"
Issues = "https://github.com/bihealth/hpc-access-cli/issues"

[dependency-groups]
dev = [
  "ruff~=0.16",
  "pyright~=1.1",
  "datamodel-code-generator~=0.71",
  "hpc-access @ git+https://github.com/bihealth/hpc-access.git@v1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_access_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
